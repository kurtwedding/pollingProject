#JPA / Test Schema 
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.batch_size=1
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false
spring.jpa.show-sql=false

# Data source (explicitly for testing)
spring.datasource.url=jdbc:tc:postgresql:14-alpine:///pollingproject
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

pollingproject.api.key=test-api-key-for-tests

POLLINGPROJECT_API_KEY=dummy-key
GTFS_API_KEY=dummy-gtfs-key
GTFS_API_URL=http://dummy-url.com
polling.enabled=false

# Keep existing config
spring.sql.init.mode=never